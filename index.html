<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="공수체크" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<title>공수체크</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
  <h1 id="header-title">공수체크</h1>
</header>

<main id="view-input" class="view active">
  <section class="card">
    <div class="field">
      <label>날짜</label>
      <div class="date-row">
        <button type="button" class="step-btn" id="date-prev">‹</button>
        <input type="date" id="input-date" />
        <button type="button" class="step-btn" id="date-next">›</button>
      </div>
    </div>

    <div class="field">
      <label>업체</label>
      <div class="chip-row" id="company-chip-row"></div>
    </div>

    <div class="field">
      <label>공수</label>
      <div class="gongsu-row">
        <button type="button" class="step-btn" id="gongsu-minus">−0.5</button>
        <input type="number" id="input-gongsu" step="0.5" min="0" value="1" inputmode="decimal" />
        <button type="button" class="step-btn" id="gongsu-plus">+0.5</button>
      </div>
      <div class="preset-row" id="gongsu-presets"></div>
    </div>

    <div class="field">
      <label>메모 <span class="optional">(선택)</span></label>
      <input type="text" id="input-memo" placeholder="예: 오전 반차, 특근 등" />
    </div>

    <button type="button" class="primary-btn" id="save-btn">저장</button>
  </section>

  <section class="card">
    <div class="card-title-row">
      <h2>최근 입력</h2>
    </div>
    <div id="recent-list" class="record-list"></div>
  </section>
</main>

<main id="view-month" class="view">
  <section class="card">
    <div class="month-nav">
      <button type="button" class="step-btn" id="month-prev">‹</button>
      <div id="month-label" class="month-label"></div>
      <button type="button" class="step-btn" id="month-next">›</button>
    </div>
    <div class="total-highlight">
      <span class="total-label">이번 달 합계</span>
      <span class="total-value" id="month-total">0</span>
    </div>
  </section>

  <section class="card">
    <h2>업체별 합산</h2>
    <div id="month-company-summary" class="summary-list"></div>
  </section>

  <section class="card">
    <h2>상세 내역</h2>
    <div id="month-record-list" class="record-list"></div>
  </section>
</main>

<main id="view-stats" class="view">
  <section class="card">
    <h2>전체 업체별 합산</h2>
    <div id="all-company-summary" class="summary-list"></div>
  </section>

  <section class="card">
    <h2>월별 합산</h2>
    <div id="all-month-summary" class="summary-list"></div>
  </section>
</main>

<main id="view-companies" class="view">
  <section class="card">
    <div class="field">
      <label>새 업체 추가</label>
      <div class="add-row">
        <input type="text" id="new-company-name" placeholder="업체명 입력" />
        <button type="button" class="primary-btn small" id="add-company-btn">추가</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>업체 목록</h2>
    <div id="company-manage-list" class="manage-list"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button type="button" class="nav-btn active" data-view="input">
    <span class="nav-icon">✎</span><span>입력</span>
  </button>
  <button type="button" class="nav-btn" data-view="month">
    <span class="nav-icon">📅</span><span>월별현황</span>
  </button>
  <button type="button" class="nav-btn" data-view="stats">
    <span class="nav-icon">📊</span><span>전체통계</span>
  </button>
  <button type="button" class="nav-btn" data-view="companies">
    <span class="nav-icon">🏢</span><span>업체관리</span>
  </button>
</nav>

<div id="edit-modal" class="modal-overlay">
  <div class="modal">
    <h2>내역 수정</h2>
    <div class="field">
      <label>날짜</label>
      <input type="date" id="edit-date" />
    </div>
    <div class="field">
      <label>업체</label>
      <div class="chip-row" id="edit-company-chip-row"></div>
    </div>
    <div class="field">
      <label>공수</label>
      <div class="gongsu-row">
        <button type="button" class="step-btn" id="edit-gongsu-minus">−0.5</button>
        <input type="number" id="edit-gongsu" step="0.5" min="0" inputmode="decimal" />
        <button type="button" class="step-btn" id="edit-gongsu-plus">+0.5</button>
      </div>
    </div>
    <div class="field">
      <label>메모</label>
      <input type="text" id="edit-memo" />
    </div>
    <div class="modal-actions">
      <button type="button" class="danger-btn" id="edit-delete-btn">삭제</button>
      <div class="modal-actions-right">
        <button type="button" class="ghost-btn" id="edit-cancel-btn">취소</button>
        <button type="button" class="primary-btn" id="edit-save-btn">저장</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="공수체크" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<title>공수체크</title>
<link rel="stylesheet" href="styles.css" />
<script>
  try {
    var __s = JSON.parse(localStorage.getItem("gongsu_settings_v1"));
    if (__s && __s.theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
</script>
</head>
<body>

<header class="app-header">
  <button type="button" class="menu-btn" id="menu-btn" aria-label="메뉴">☰</button>
  <h1 id="header-title">공수체크</h1>
</header>

<div id="side-menu-overlay" class="modal-overlay side-menu-overlay">
  <div class="side-menu">
    <div class="side-menu-header">메뉴</div>
    <button type="button" class="side-menu-item" id="menu-settings-btn">
      <span class="side-menu-icon">⚙️</span> 설정
    </button>
  </div>
</div>

<main id="view-input" class="view active">
  <section class="card calendar-card">
    <div class="month-nav">
      <button type="button" class="step-btn" id="cal-prev">‹</button>
      <div id="cal-month-label" class="month-label"></div>
      <button type="button" class="step-btn" id="cal-next">›</button>
    </div>
    <div class="calendar-weekdays">
      <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
    <div id="calendar-company-filter" class="chip-row calendar-company-filter"></div>
    <p class="calendar-hint">날짜를 더블탭하면 공수 추가·삭제·변경이 가능합니다.</p>
  </section>

  <section class="card">
    <div class="selected-date-heading" id="selected-date-heading"></div>

    <div class="field">
      <label>업체</label>
      <div class="chip-row" id="company-chip-row"></div>
    </div>

    <div class="field">
      <label>공수</label>
      <div class="gongsu-row">
        <button type="button" class="step-btn gongsu-step-minus" id="gongsu-minus">−0.5</button>
        <input type="number" id="input-gongsu" step="0.5" min="0" value="1" inputmode="decimal" />
        <button type="button" class="step-btn gongsu-step-plus" id="gongsu-plus">+0.5</button>
      </div>
      <div class="preset-row" id="gongsu-presets"></div>
    </div>

    <div class="field">
      <label>메모 <span class="optional">(선택)</span></label>
      <input type="text" id="input-memo" placeholder="예: 오전 반차, 특근 등" />
    </div>

    <button type="button" class="primary-btn" id="save-btn">저장</button>
  </section>

  <section class="card">
    <div class="card-title-row">
      <h2 id="day-list-title">이 날짜의 기록</h2>
    </div>
    <p class="swipe-hint">항목을 좌측으로 슬라이드하면 삭제할 수 있습니다.</p>
    <div id="day-record-list" class="record-list"></div>
  </section>
</main>

<main id="view-month" class="view">
  <section class="card">
    <div class="month-nav">
      <button type="button" class="step-btn" id="month-prev">‹</button>
      <div id="month-label" class="month-label"></div>
      <button type="button" class="step-btn" id="month-next">›</button>
    </div>
    <div class="total-highlight">
      <span class="total-label">이번 달 합계</span>
      <span class="total-value" id="month-total">0</span>
    </div>
  </section>

  <section class="card">
    <h2>업체별 합산</h2>
    <div id="month-company-summary" class="summary-list"></div>
  </section>

  <section class="card">
    <h2>상세 내역</h2>
    <div id="month-record-list" class="record-list"></div>
  </section>
</main>

<main id="view-stats" class="view">
  <section class="card">
    <h2>전체 업체별 합산</h2>
    <div id="all-company-summary" class="summary-list"></div>
  </section>

  <section class="card">
    <h2>월별 합산</h2>
    <div id="all-month-summary" class="summary-list"></div>
  </section>
</main>

<main id="view-companies" class="view">
  <section class="card">
    <div class="field">
      <label>새 업체 추가</label>
      <div class="add-row">
        <input type="text" id="new-company-name" placeholder="업체명 입력" />
        <button type="button" class="primary-btn small" id="add-company-btn">추가</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>업체 목록</h2>
    <div id="company-manage-list" class="manage-list"></div>
  </section>
</main>

<main id="view-settings" class="view">
  <section class="card">
    <h2>테마</h2>
    <div class="theme-option-row">
      <button type="button" class="theme-option" data-theme="light">
        <span class="theme-swatch light-swatch"></span>
        <span>밝은 테마 (백/흑)</span>
      </button>
      <button type="button" class="theme-option" data-theme="dark">
        <span class="theme-swatch dark-swatch"></span>
        <span>어두운 테마 (흑/백)</span>
      </button>
    </div>
  </section>

  <section class="card">
    <h2>공수 증감 단위</h2>
    <div class="chip-row">
      <button type="button" class="preset-chip gongsu-step-option" data-step="0.5">0.5씩</button>
      <button type="button" class="preset-chip gongsu-step-option" data-step="1">1씩</button>
    </div>
  </section>

  <section class="card">
    <h2>업체별 색상</h2>
    <div id="settings-company-colors" class="manage-list"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button type="button" class="nav-btn active" data-view="input">
    <span class="nav-icon">✎</span><span>입력</span>
  </button>
  <button type="button" class="nav-btn" data-view="month">
    <span class="nav-icon">📅</span><span>월별현황</span>
  </button>
  <button type="button" class="nav-btn" data-view="stats">
    <span class="nav-icon">📊</span><span>전체통계</span>
  </button>
  <button type="button" class="nav-btn" data-view="companies">
    <span class="nav-icon">🏢</span><span>업체관리</span>
  </button>
</nav>

<div id="edit-modal" class="modal-overlay">
  <div class="modal">
    <h2>내역 수정</h2>
    <div class="field">
      <label>날짜</label>
      <input type="date" id="edit-date" />
    </div>
    <div class="field">
      <label>업체</label>
      <div class="chip-row" id="edit-company-chip-row"></div>
    </div>
    <div class="field">
      <label>공수</label>
      <div class="gongsu-row">
        <button type="button" class="step-btn gongsu-step-minus" id="edit-gongsu-minus">−0.5</button>
        <input type="number" id="edit-gongsu" step="0.5" min="0" inputmode="decimal" />
        <button type="button" class="step-btn gongsu-step-plus" id="edit-gongsu-plus">+0.5</button>
      </div>
    </div>
    <div class="field">
      <label>메모</label>
      <input type="text" id="edit-memo" />
    </div>
    <div class="modal-actions">
      <button type="button" class="danger-btn" id="edit-delete-btn">삭제</button>
      <div class="modal-actions-right">
        <button type="button" class="ghost-btn" id="edit-cancel-btn">취소</button>
        <button type="button" class="primary-btn" id="edit-save-btn">저장</button>
      </div>
    </div>
  </div>
</div>

<div id="day-modal" class="modal-overlay">
  <div class="modal">
    <div class="day-modal-header">
      <h2 id="day-modal-heading">날짜</h2>
      <button type="button" class="ghost-btn modal-close-btn" id="day-modal-close-btn">닫기</button>
    </div>

    <div id="day-modal-list" class="record-list"></div>

    <div class="day-modal-add-heading">공수 추가</div>

    <div class="field">
      <label>업체</label>
      <div class="chip-row" id="day-modal-company-chip-row"></div>
    </div>

    <div class="field">
      <label>공수</label>
      <div class="gongsu-row">
        <button type="button" class="step-btn gongsu-step-minus" id="day-modal-gongsu-minus">−0.5</button>
        <input type="number" id="day-modal-gongsu" step="0.5" min="0" value="1" inputmode="decimal" />
        <button type="button" class="step-btn gongsu-step-plus" id="day-modal-gongsu-plus">+0.5</button>
      </div>
      <div class="preset-row" id="day-modal-gongsu-presets"></div>
    </div>

    <div class="field">
      <label>메모 <span class="optional">(선택)</span></label>
      <input type="text" id="day-modal-memo" placeholder="예: 오전 반차, 특근 등" />
    </div>

    <button type="button" class="primary-btn" id="day-modal-add-btn">추가</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
